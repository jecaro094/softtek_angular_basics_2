<form #loginForm="ngForm">
  <div>
    <label for="username">Username</label>
    <input
      type="text"
      id="username"
      name="username"
      #usernameInput="ngModel"
      [(ngModel)]="username"
      required
      minlength="3"
      maxlength="20"
      [attr.aria-invalid]="usernameInput.invalid" />
    @if (usernameInput.errors) {
    <small>{{ usernameInput.errors | json }}</small>
    }
  </div>
  <div>
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      [(ngModel)]="password"
      #passwordInput="ngModel"
      required
      minlength="4"
      maxlength="20"
      [attr.aria-invalid]="passwordInput.invalid" />
    @if (passwordInput.errors) {
    <small>{{ passwordInput.errors | json }}</small>
    }
  </div>
  <button type="submit" (click)="sendLoginDto.emit()" [disabled]="loginForm.invalid">Login</button>
</form>
